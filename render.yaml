services:
  # ─── Frontend (React + Vite) ──────────────────────────────────────────────
  - type: web
    name: jobytra-job-fare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ─── Backend (Spring Boot Docker) ───────────────────────────────────────────
  - type: web
    name: jobytra-job-fare-backend
    runtime: docker
    rootDir: backend
    envVars:
      # Activate production Spring profile
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # JWT
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 86400000

      # Mail (Gmail SMTP)
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # Database (Neon Postgres)
      - key: DB_URL
        value: jdbc:postgresql://ep-snowy-wind-az7wv1dl.c-3.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_eQh26GCcvEwy
