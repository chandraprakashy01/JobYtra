services:
  # ─── Frontend (React + Vite) ──────────────────────────────────────────────
  - type: web
    name: jobytra-job-fare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ─── Backend (Spring Boot + Java 21) ──────────────────────────────────────
  - type: web
    name: jobytra-job-fare-backend
    runtime: java
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/placement-portal-0.0.1-SNAPSHOT.jar
    envVars:
      # Java version - must be 21 for Lombok compatibility
      - key: JAVA_VERSION
        value: 21

      # MongoDB Atlas URI — set real value in Render Dashboard → Environment
      - key: MONGO_URI
        sync: false

      # JWT
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 86400000

      # Mail (Gmail SMTP)
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
