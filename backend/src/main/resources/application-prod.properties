# ══════════════════════════════════════════════════════════════════════════════
#  application-prod.properties  —  PRODUCTION PROFILE (Render + Neon Postgres)
#  Activated by setting: SPRING_PROFILES_ACTIVE=prod
#  All sensitive values MUST be set as environment variables in Render dashboard.
#  Never hardcode secrets here — this file is committed to git.
# ══════════════════════════════════════════════════════════════════════════════

# ── PostgreSQL (Neon) ──────────────────────────────────────────────────────────
# Set these in Render Dashboard → Environment Variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Neon requires SSL
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ── CORS (Vercel frontend) ─────────────────────────────────────────────────────
app.corsAllowedOrigins=https://jobytra.vercel.app

# ── Logging (minimal in production) ───────────────────────────────────────────
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.com.placement=INFO
spring.jpa.show-sql=false
debug=false
