# ══════════════════════════════════════════════════════════════════════════════
#  application-dev.properties  —  LOCAL DEVELOPMENT PROFILE
#  Activated automatically when SPRING_PROFILES_ACTIVE is not set (default).
#  Use: ./mvnw spring-boot:run
#       or  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# ══════════════════════════════════════════════════════════════════════════════

# ── PostgreSQL (local) ─────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/placement_db
spring.datasource.username=postgres
spring.datasource.password=12345

# ── CORS (allow local frontend dev server) ─────────────────────────────────────
app.corsAllowedOrigins=http://localhost:5173,http://localhost:3000

# ── Logging (verbose for debugging) ───────────────────────────────────────────
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.placement=DEBUG
spring.jpa.show-sql=true
debug=false
