spring.application.name=placement-portal
server.port=8080

# ── Active Profile ─────────────────────────────────────────────────────────────
# Override with: -Dspring.profiles.active=prod  (Render / CI)
# or set env var: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ── JPA (shared) ───────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── JWT (shared) ───────────────────────────────────────────────────────────────
app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ── Mail (shared transport) ────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── File upload (shared) ───────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── AI keys (read from env in both profiles) ─────────────────────────
app.geminiApiKey=${GEMINI_API_KEY:}
