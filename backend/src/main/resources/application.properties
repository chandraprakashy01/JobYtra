spring.application.name=placement-portal
server.port=8080

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your .env or deployment environment
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/placement_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ────────────────────────────────────────────────────────────────────────
app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ── Mail (Gmail SMTP) ──────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── File upload ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
debug= ture
